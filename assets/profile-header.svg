<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Mahmut Alperen Ünal — Independent Mobile Product Developer</title>
  <desc id="desc">A dark, modern banner for a mobile product developer and the founder of AlpWare Studio.</desc>
  <defs>
